name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble unsigned minified Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Run unit tests and Release APK contracts
        id: unit_tests
        env:
          DOUAI_VERIFY_RELEASE_APK: ${{ github.workspace }}/app/build/outputs/apk/release/app-release-unsigned.apk
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Report host DEX integration coverage
        if: always() && steps.unit_tests.outcome != 'skipped'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("app/build/test-results/testDebugUnitTest/TEST-com.douai.module.scan.Douyin406AnchorTest.xml")
          apk_path = os.environ.get("DOUAI_TEST_APK", "")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          if not report.is_file():
              message = "Host DEX scan: no JUnit report was produced."
              print(message)
              with summary.open("a", encoding="utf-8") as output:
                  output.write(f"## Host DEX integration test\n\n**Not verified:** {message}\n")
              sys.exit(1)

          root = ET.parse(report).getroot()
          test_case = next(
              (case for case in root.iter("testcase")
               if case.attrib.get("name") == "verifiedFeedAnchorsAreUniqueAcrossTheLocalHostDexSet"),
              None,
          )
          if test_case is None:
              message = "Host DEX scan: expected test case was absent from its JUnit report."
              print(message)
              with summary.open("a", encoding="utf-8") as output:
                  output.write(f"## Host DEX integration test\n\n**Not verified:** {message}\n")
              sys.exit(1)

          skipped = test_case.find("skipped") is not None
          failed = test_case.find("failure") is not None or test_case.find("error") is not None
          apk_is_readable = bool(apk_path) and Path(apk_path).is_file()

          if failed:
              message = "Host DEX scan failed; see the unit test report."
              print(message)
              with summary.open("a", encoding="utf-8") as output:
                  output.write(f"## Host DEX integration test\n\n**Failed:** {message}\n")
              sys.exit(1)
          elif skipped and not apk_is_readable:
              message = "SKIPPED / UNCONFIGURED: DOUAI_TEST_APK is not set to a readable local host APK; host DEX anchors were not verified."
              print(message)
              with summary.open("a", encoding="utf-8") as output:
                  output.write(f"## Host DEX integration test\n\n**{message}**\n")
          elif skipped:
              message = "Host DEX scan was skipped even though DOUAI_TEST_APK points to a readable file."
              print(message)
              with summary.open("a", encoding="utf-8") as output:
                  output.write(f"## Host DEX integration test\n\n**Not verified:** {message}\n")
              sys.exit(1)
          elif not apk_is_readable:
              message = "Host DEX test reported success without a readable DOUAI_TEST_APK path."
              print(message)
              with summary.open("a", encoding="utf-8") as output:
                  output.write(f"## Host DEX integration test\n\n**Not verified:** {message}\n")
              sys.exit(1)
          else:
              message = "PASSED: host DEX anchors were checked against DOUAI_TEST_APK."
              print(message)
              with summary.open("a", encoding="utf-8") as output:
                  output.write(f"## Host DEX integration test\n\n**{message}**\n")
          PY

      - name: Run Release Lint
        run: ./gradlew :app:lintRelease --console=plain
